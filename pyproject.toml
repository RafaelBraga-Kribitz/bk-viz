[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bk-viz"
version = "1.0.0"
description = "Braga-Kribitz Design System applied to charts (matplotlib, optional plotly)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rafael Braga-Kribitz" }]
dependencies = ["matplotlib>=3.7", "fonttools>=4.40"]

[project.optional-dependencies]
plotly = ["plotly>=5.18"]

[tool.hatch.build.targets.wheel]
only-include = ["bk_theme.py"]
sources = ["."]
